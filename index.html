<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <title>소화기 QR 촬영 · HANLA</title>
  <script type="module" crossorigin src="./assets/main-DhQAeFDJ.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/trial-config-DdPrdTT6.js">
  <link rel="stylesheet" crossorigin href="./assets/trial-config-DtQORixK.css">
</head>
<body class="scanning">
  <main>
    <section id="scanner-screen" class="scanner-screen" aria-label="소화기 QR 촬영">
      <video id="live-camera" autoplay muted playsinline aria-label="실시간 후면 카메라"></video>
      <img id="sample-camera" alt="QR과 압력계를 그린 촬영 시험용 샘플" hidden>
      <header class="scanner-heading"><h1>소화기 QR 촬영</h1><span>HANLA</span></header>
      <div class="composition-guide" aria-hidden="true">
        <div class="gauge-guide"><span>충압계</span></div>
        <div id="qr-frame" class="qr-frame"><span>QR</span></div>
      </div>
      <div class="scanner-instructions">
        <p id="scan-status" role="status" aria-live="polite">카메라 사용을 허용해 주세요</p>
        <p class="scanner-hint">QR을 네모에 크게 맞추고<br>위쪽에 충압계가 함께 보이게 해 주세요</p>
        <button id="retry-camera" class="scanner-retry" type="button" hidden>카메라 다시 켜기</button>
      </div>
      <noscript><p class="noscript-message">촬영하려면 브라우저에서 JavaScript를 사용하도록 설정해 주세요.</p></noscript>
    </section>
    <section id="review-screen" class="page review-screen" aria-labelledby="review-title" hidden>
      <header class="header"><a class="brand" href="#scan">HANLA <span>소화기 점검</span></a><span class="review-step">촬영 사진 확인</span></header>
      <div class="review-intro"><p class="eyebrow">QR 인식 완료</p><h1 id="review-title">충압계가 잘 보이나요?</h1><p class="description">바늘과 눈금이 눈으로 읽히는지 확인해 주세요.</p></div>
      <p id="sample-notice" class="sample-notice" hidden>샘플 체험 · 실제 소화기 사진이 아닌 합성 이미지입니다.</p>
      <p id="detected-code" class="code-value"></p>
      <figure class="preview"><img id="photo-preview" alt="QR과 충압계를 함께 촬영한 사진"><figcaption id="photo-info"></figcaption></figure>
      <div class="review-actions"><button id="enlarge" class="secondary" type="button">사진 크게 보기</button><a class="primary button-link" href="#scan">다시 촬영</a></div>
      <p class="review-note">아직 저장하지 않은 시험 사진입니다.<br>새로고침하거나 페이지를 닫으면 사라집니다.</p>
    </section>
  </main>
  <dialog id="viewer" aria-labelledby="viewer-title">
    <div class="viewer-heading"><h2 id="viewer-title">충압계 확인</h2><button id="close-viewer" class="secondary compact" type="button">닫기</button></div>
    <button id="original-size" class="secondary compact" type="button" aria-pressed="false">원본 크기로 보기</button>
    <div class="viewer-image"><img id="viewer-photo" alt="확대해서 확인할 촬영 사진"></div>
  </dialog>
</body>
</html>
