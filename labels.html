<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>시험 QR 인쇄 · HANLA</title>


  <script type="module" crossorigin src="./assets/labels-C2U4oDh9.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/trial-config-DdPrdTT6.js">
  <link rel="stylesheet" crossorigin href="./assets/trial-config-DtQORixK.css">
  <link rel="stylesheet" crossorigin href="./assets/labels-Cx_xkziq.css">
</head>
<body>
  <main class="page label-page">
    <header class="header screen-only">
      <a class="brand" href="./">HANLA <span>소화기 점검</span></a>
      <a class="text-link" href="./">촬영 시험으로</a>
    </header>
    <section class="intro">
      <p class="eyebrow">현장 촬영 시험 · 1단계</p>
      <h1>소화기 한 대로<br>QR 크기를 비교하세요</h1>
      <p class="description">두 라벨에는 같은 시험 번호가 들어 있습니다.<br>크기를 하나 골라 붙여 촬영하고, 다른 크기로 바꿔 비교해 주세요.</p>
    </section>
    <div class="print-controls screen-only">
      <button id="print" class="primary" type="button">QR 라벨 인쇄</button>
      <p class="hint">인쇄 배율을 100% · 실제 크기로 맞춰 주세요.</p>
    </div>
    <div class="labels">
      <figure class="label">
        <img src="./trial-qr.svg" class="qr-small" alt="20mm 시험용 QR, FIRECHECK-TEST-001">
        <figcaption><strong data-test-id></strong><span>20 × 20 mm · 여백 포함</span></figcaption>
      </figure>
      <figure class="label">
        <img src="./trial-qr.svg" class="qr-large" alt="30mm 시험용 QR, FIRECHECK-TEST-001">
        <figcaption><strong data-test-id></strong><span>30 × 30 mm · 여백 포함</span></figcaption>
      </figure>
    </div>
    <section class="print-guide">
      <h2>출력 크기 확인</h2>
      <div class="ruler" aria-label="출력 후 자로 확인할 50mm 눈금"><span>50 mm</span></div>
      <p>자로 위 눈금을 재서 인쇄 배율을 확인해 주세요.</p>
      <p>라벨은 압력계와 함께 보이는 곳에 임시로 붙입니다. 눈금과 제품 표시, 소화기 조작 부위를 가리지 않게 해 주세요.</p>
    </section>
  </main>

</body>
</html>
