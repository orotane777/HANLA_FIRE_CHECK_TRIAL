<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="referrer" content="no-referrer" />
    <title>구역 점검 · HANLA</title>
    <script type="module" crossorigin src="./assets/inspect-B7XOB1Ya.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/inspect-BNApY0ix.css">
  </head>
  <body>
    <main class="inspection">
      <header class="mast">
        <div>
          <div class="identity">HANLA <span>소화기 점검</span></div>
          <h1 id="zone-name">구역 점검</h1>
        </div>
        <div class="period">
          <span id="storage-mode"></span><time id="month-name"></time>
          <p id="progress">자리 불러오는 중</p>
        </div>
      </header>
      <section class="camera-panel" aria-label="QR 자동 촬영">
        <div id="direct-capture" hidden>
          <label for="inspector-name">점검자 이름</label>
          <input id="inspector-name" maxlength="50" autocomplete="off" placeholder="이름 입력" list="inspector-names" disabled />
          <datalist id="inspector-names"></datalist>
          <button type="button" id="start-linked" class="primary" disabled>촬영 시작</button>
          <button type="button" id="cancel-linked" hidden>촬영 취소</button>
          <button type="button" id="direct-miss" disabled>못 찍음 기록</button>
        </div>
        <div id="camera-view" class="camera-view">
          <video id="live-camera" autoplay muted playsinline aria-label="후면 카메라"></video>
          <div id="guide" class="guide" aria-hidden="true">
            <span class="gauge"><b>충압계</b></span
            ><span id="qr-frame" class="qr"><b>QR</b></span>
          </div>
        </div>
        <div class="guidance">
          <div>
            <strong id="scan-status" role="status">카메라 준비 중</strong
            ><small id="scan-detail">위쪽 충압계와 QR을 함께 담아 주세요.</small>
          </div>
          <button id="cancel-retake" hidden>다시 찍기 취소</button
          ><button id="camera-retry" hidden>다시 켜기</button>
        </div>
      </section>
      <section class="review-bar" aria-label="방금 찍은 사진">
        <button id="recent" disabled>
          <span class="recent-thumb"
            ><img id="recent-photo" alt="" hidden /><span id="empty-thumb" aria-hidden="true">▧</span></span
          ><span
            ><small>방금 찍은 사진</small><strong id="recent-title">촬영 대기</strong
            ><span id="recent-detail" aria-live="polite">QR을 맞추면 자동으로 찍습니다.</span></span
          ><span class="chevron" aria-hidden="true">›</span>
        </button>
        <div id="direct-review" hidden>
          <p id="capture-by"></p>
          <div class="actions">
            <button type="button" id="direct-retake">다시 찍기</button>
            <button type="button" id="direct-flag">이상 있음</button>
          </div>
        </div>
      </section>
      <button type="button" id="direct-next" class="primary" hidden>다음 소화기 촬영</button>
      <section class="positions" aria-label="구역 자리 목록">
        <div class="list-head">
          <h2>점검 자리</h2>
          <span id="counts"></span>
        </div>
        <div class="list-body">
          <div id="position-list"></div>
          <p id="empty-catalog" hidden>
            등록된 자리가 없습니다. <a href="./admin.html#settings">관리자 화면의 구역 설정</a>에서 도면과
            자리를 등록해 주세요.
          </p>
          <p id="empty-offline" hidden>연결 후 구역 정보를 먼저 불러와 주세요.</p>
        </div>
      </section>
      <footer>
        <p id="notice" role="status" hidden></p>
        <div class="bottom">
          <button id="map-open" class="primary" disabled>도면 보기</button
          ><button id="retry-pending">저장 대기 0건</button>
        </div>
      </footer>
      <noscript>이 화면을 사용하려면 JavaScript를 켜 주세요.</noscript>
    </main>

    <dialog id="map-dialog" aria-labelledby="map-title">
      <div class="dialog-head">
        <h2 id="map-title">구역 도면</h2>
        <button type="button" data-close>닫기</button>
      </div>
      <p id="map-summary"></p>
      <div id="map-scroll" class="map-scroll">
        <div id="map-stage" class="map-stage">
          <img id="map-img" alt="구역 자리 배치도" />
          <div id="map-dots"></div>
        </div>
      </div>
      <p id="map-warning" hidden>도면을 불러오지 못했습니다. 아래 목록에서 자리를 선택해 주세요.</p>
      <div class="zoom">
        <button id="zoom-out" aria-label="도면 축소">−</button><button id="zoom-reset">전체 보기</button
        ><button id="zoom-in" aria-label="도면 확대">＋</button>
      </div>
      <h3 id="map-list-title">자리 선택</h3>
      <div id="map-list" class="map-list"></div>
      <button id="all-places" hidden>모든 자리 보기</button>
    </dialog>

    <dialog id="position-dialog" aria-labelledby="position-title">
      <div class="dialog-head">
        <h2 id="position-title">자리 정보</h2>
        <button type="button" data-close>닫기</button>
      </div>
      <p id="position-state"></p>
      <p id="position-note"></p>
      <div class="actions">
        <button id="position-photo">최근 사진 보기</button><button id="miss-open">못 찍음 기록</button>
      </div>
    </dialog>

    <dialog id="miss-dialog" aria-labelledby="miss-title">
      <div class="dialog-head">
        <h2 id="miss-title">못 찍음 사유</h2>
        <button type="button" data-close>취소</button>
      </div>
      <form id="miss-form">
        <label
          >사유<select name="reason" required>
            <option value="">선택해 주세요</option>
            <option>소화기 없음</option>
            <option>가려져서 접근 불가</option>
            <option>라벨 훼손</option>
            <option>기타</option>
          </select></label
        >
        <label><span id="miss-note-label">메모 (선택)</span><textarea name="note" rows="2"></textarea></label>
        <label
          >현장 사진 (선택)<input
            id="miss-file"
            type="file"
            accept="image/jpeg,image/png,image/webp"
            capture="environment"
        /></label>
        <button type="button" id="remove-file" hidden>사진 첨부 취소</button>
        <p class="error" id="miss-error" role="alert" hidden></p>
        <button class="primary" type="submit">사유 저장</button>
      </form>
    </dialog>

    <dialog id="photo-dialog" aria-labelledby="photo-title">
      <div class="dialog-head">
        <h2 id="photo-title">점검 사진</h2>
        <button type="button" data-close>닫기</button>
      </div>
      <p id="photo-status"></p>
      <div id="photo-frame" class="photo-frame">
        <img id="photo-large" alt="소화기 점검 사진" />
      </div>
      <div class="actions">
        <button id="photo-zoom" aria-pressed="false">원본 크기로 보기</button
        ><button id="retake">다시 찍기</button><button id="flag-open">이상 있음</button>
      </div>
      <p id="photo-note"></p>
      <form id="flag-form" hidden>
        <label>이상 내용<textarea name="note" rows="2" required></textarea></label>
        <div class="actions">
          <button type="button" id="flag-cancel">취소</button
          ><button type="submit" class="primary">이상 표시 저장</button>
        </div>
      </form>
      <p class="error" id="photo-error" role="alert" hidden></p>
    </dialog>
  </body>
</html>
